<!-- src/renderer/overlay.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI Instructor Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            overflow: hidden;
        }
        
        .overlay-container {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            position: relative;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .overlay-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .ai-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #4dabf7, #339af0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        
        .overlay-title {
            font-size: 14px;
            font-weight: 600;
            color: #4dabf7;
        }
        
        .close-btn {
            margin-left: auto;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 18px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .overlay-content {
            font-size: 13px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .suggestion-text {
            margin-bottom: 10px;
        }
        
        .suggestion-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        
        .suggestion-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        
        .btn-primary {
            background: #4dabf7;
            color: white;
        }
        
        .btn-primary:hover {
            background: #339af0;
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .progress-bar {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1px;
            overflow: hidden;
            margin-top: 15px;
        }
        
        .progress-fill {
            height: 100%;
            background: #4dabf7;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="overlay-container">
        <div class="overlay-header">
            <div class="ai-avatar">🤖</div>
            <div class="overlay-title">AI Instructor</div>
            <button class="close-btn" onclick="hideOverlay()">×</button>
        </div>
        
        <div class="overlay-content">
            <div class="suggestion-text" id="suggestionText">
                💡 Suggerimento: Prova a utilizzare Ctrl+T per inserire una tabella velocemente!
            </div>
            
            <div class="suggestion-actions">
                <button class="suggestion-btn btn-primary" onclick="showMoreInfo()">
                    Mostra come fare
                </button>
                <button class="suggestion-btn btn-secondary" onclick="dismissSuggestion()">
                    Non ora
                </button>
            </div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        
        class OverlayManager {
            constructor() {
                this.currentSuggestion = null;
                this.isVisible = false;
                this.autoHideTimeout = null;
                
                this.initializeElements();
                this.setupEventListeners();
            }
            
            initializeElements() {
                this.container = document.querySelector('.overlay-container');
                this.suggestionText = document.getElementById('suggestionText');
                this.closeBtn = document.querySelector('.close-btn');
                this.acceptBtn = document.querySelector('.btn-primary');
                this.dismissBtn = document.querySelector('.btn-secondary');
            }
            
            setupEventListeners() {
                // Bottoni
                this.closeBtn?.addEventListener('click', () => this.hideOverlay());
                this.acceptBtn?.addEventListener('click', () => this.acceptSuggestion());
                this.dismissBtn?.addEventListener('click', () => this.dismissSuggestion());
                
                // Listener IPC da main.js
                ipcRenderer.on('update-content', (event, data) => {
                    this.showSuggestion(data);
                });
                
                ipcRenderer.on('hide-overlay', () => {
                    this.hideOverlay();
                });
                
                // Hotkey
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.hideOverlay();
                    } else if (e.key === 'Enter') {
                        this.acceptSuggestion();
                    }
                });
                
                // Inizialmente nascosto
                this.hideOverlay();
            }
            
            showSuggestion(suggestion) {
                this.currentSuggestion = suggestion;
                
                // Aggiorna contenuto con tutti i campi
                if (this.suggestionText) {
                    let content = '';
                    
                    // Titolo se presente
                    if (suggestion.title) {
                        content += `<strong>${suggestion.title}</strong><br><br>`;
                    }
                    
                    // Testo principale
                    const text = suggestion.text || suggestion.message || 'Suggerimento AI disponibile';
                    content += text;
                    
                    // Link tutorial se presente
                    if (suggestion.detailed_tutorial_link) {
                        content += `<br><br><a href="${suggestion.detailed_tutorial_link}" target="_blank" style="color: #4dabf7; text-decoration: underline;">📖 Tutorial dettagliato</a>`;
                    }
                    
                    this.suggestionText.innerHTML = content;
                }
                
                // Aggiorna pulsanti se necessario
                if (suggestion.detailed_tutorial_link && this.acceptBtn) {
                    this.acceptBtn.textContent = 'Apri Tutorial';
                } else if (this.acceptBtn) {
                    this.acceptBtn.textContent = 'Mostra come fare';
                }
                
                // Mostra overlay
                document.body.style.display = 'block';
                this.isVisible = true;
                
                // Animazione di entrata
                setTimeout(() => {
                    if (this.container) {
                        this.container.style.transform = 'translateX(0)';
                        this.container.style.opacity = '1';
                    }
                }, 50);
                
                // Auto-hide dopo 15 secondi (più tempo per leggere)
                this.clearAutoHide();
                this.autoHideTimeout = setTimeout(() => {
                    this.hideOverlay();
                }, 15000);
                
                console.log('Overlay mostrato con suggerimento:', suggestion);
            }
            
            hideOverlay() {
                if (!this.isVisible) return;
                
                this.clearAutoHide();
                
                if (this.container) {
                    this.container.style.transform = 'translateX(100%)';
                    this.container.style.opacity = '0';
                }
                
                setTimeout(() => {
                    document.body.style.display = 'none';
                    this.isVisible = false;
                }, 300);
                
                console.log('Overlay nascosto');
            }
            
            acceptSuggestion() {
                if (this.currentSuggestion) {
                    // Genera suggestion_id univoco se non presente
                    const suggestionId = this.currentSuggestion.suggestion_id || 
                                       `suggestion_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                    
                    // Se c'è un tutorial link, aprilo
                    if (this.currentSuggestion.detailed_tutorial_link) {
                        require('electron').shell.openExternal(this.currentSuggestion.detailed_tutorial_link);
                    }
                    
                    // Invia feedback al processo principale
                    ipcRenderer.send('suggestion-action', {
                        action: 'accept',
                        suggestion_id: suggestionId,
                        suggestion: this.currentSuggestion,
                        timestamp: Date.now(),
                        user_action: this.currentSuggestion.detailed_tutorial_link ? 'opened_tutorial' : 'accepted'
                    });
                    
                    console.log('Suggerimento accettato:', this.currentSuggestion);
                }
                
                this.hideOverlay();
            }
            
            dismissSuggestion() {
                if (this.currentSuggestion) {
                    // Genera suggestion_id univoco se non presente
                    const suggestionId = this.currentSuggestion.suggestion_id || 
                                       `suggestion_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                    
                    // Invia feedback al processo principale
                    ipcRenderer.send('suggestion-action', {
                        action: 'dismiss',
                        suggestion_id: suggestionId,
                        suggestion: this.currentSuggestion,
                        timestamp: Date.now(),
                        user_action: 'dismissed'
                    });
                    
                    console.log('Suggerimento rifiutato:', this.currentSuggestion);
                }
                
                this.hideOverlay();
            }
            
            clearAutoHide() {
                if (this.autoHideTimeout) {
                    clearTimeout(this.autoHideTimeout);
                    this.autoHideTimeout = null;
                }
            }
        }
        
        // Inizializza quando il DOM è pronto
        document.addEventListener('DOMContentLoaded', () => {
            window.overlayManager = new OverlayManager();
            console.log('Overlay manager inizializzato');
        });
        
        // Funzioni legacy per compatibilità
        function hideOverlay() {
            window.overlayManager?.hideOverlay();
        }
        
        function showMoreInfo() {
            window.overlayManager?.acceptSuggestion();
        }
        
        function dismissSuggestion() {
            window.overlayManager?.dismissSuggestion();
        }
    </script>
</body>
</html>
